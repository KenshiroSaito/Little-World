name: Deploy to GitHub Pages

# GitHub Pages serves the main branch as it is, so the built game is committed
# to play/ on main; the root index.html sends visitors there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit the build to play/
        run: |
          rm -rf play
          cp -r dist play
          git add -A play
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish build of ${GITHUB_SHA::7}"
          git push
